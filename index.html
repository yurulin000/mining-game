<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>礦坑原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#07070a; }
  body { font-family:"Microsoft JhengHei","PingFang TC",sans-serif; color:#e8e2d6; }
  canvas { display:block; }

  #hint {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    background:rgba(10,10,14,.72); border:1px solid rgba(255,220,160,.18);
    padding:9px 18px; border-radius:999px; font-size:13px; letter-spacing:.5px;
    white-space:nowrap; pointer-events:none; backdrop-filter:blur(4px);
  }
  #hint b { color:#ffd79a; font-weight:600; }

  #info {
    position:fixed; right:16px; top:16px; text-align:right;
    font-size:12px; line-height:1.7; color:#8d8878; pointer-events:none;
  }
  #info span { color:#ffd79a; }

  #title {
    position:fixed; left:20px; top:16px; pointer-events:none;
  }
  #title h1 { font-size:20px; font-weight:600; letter-spacing:2px; color:#f0e6d2; }
  #title p  { font-size:11px; color:#7d7768; letter-spacing:1px; margin-top:3px; }

  #mapbox {
    position:fixed; left:20px; bottom:20px;
    border:1px solid rgba(255,220,160,.18); border-radius:8px;
    background:rgba(10,10,14,.65); padding:6px; backdrop-filter:blur(4px);
  }
  #minimap { display:block; border-radius:4px; }

  #panel {
    position:fixed; right:16px; bottom:20px;
    background:rgba(10,10,14,.65); border:1px solid rgba(255,220,160,.18);
    padding:8px 14px; border-radius:8px; font-size:12px; color:#c9c2b2;
    backdrop-filter:blur(4px);
  }
  #panel input { vertical-align:middle; width:110px; margin-left:6px; }

  #loading {
    position:fixed; inset:0; z-index:1000; display:grid; justify-items:center; align-items:end;
    padding:0 16px max(22px, env(safe-area-inset-bottom));
    background:#070b15 url('images/Loading.png') center center / cover no-repeat;
    color:#f6e5bf; transition:opacity .55s ease; overflow:hidden;
  }
  #loading::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(3,7,18,.35), rgba(3,7,18,.12) 48%, rgba(3,7,18,.48)); }
  #loading::after { content:""; position:absolute; left:0; right:0; bottom:0; height:38%; pointer-events:none;
    background:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.34) 52%, rgba(0,0,0,.86) 100%); }
  #loading.is-done { opacity:0; pointer-events:none; }
  .loading-card { position:relative; z-index:1; width:min(100%,340px); text-align:center;
    padding:12px 14px; }
  .loading-gem { font-size:28px; line-height:1; margin-bottom:5px; filter:drop-shadow(0 0 10px #65d8ff);
    animation:loading-float 2.3s ease-in-out infinite; }
  .loading-title { font-size:18px; font-weight:700; letter-spacing:.16em; text-shadow:0 2px 12px #090f21; }
  .loading-subtitle { margin:4px 0 10px; font-size:11px; letter-spacing:.05em; color:#a9c9da; }
  .loading-track { height:10px; padding:2px; border:1px solid #a88752; border-radius:99px;
    background:#09101f; box-shadow:0 0 0 3px rgba(223,182,101,.09), inset 0 2px 5px #02040a; }
  .loading-fill { position:relative; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,#2d83b0,#61ddf5 58%,#ffe09a); box-shadow:0 0 16px #62d9f5;
    transition:width .18s ease; overflow:hidden; }
  .loading-fill::after { content:""; position:absolute; inset:0;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);
    animation:loading-shimmer 1.5s linear infinite; }
  .loading-readout { display:flex; justify-content:space-between; gap:12px; margin-top:5px;
    color:#b4c9d6; font-size:11px; letter-spacing:.04em; }
  #loading-percent { color:#ffe09a; font-weight:700; font-variant-numeric:tabular-nums; }
  #loading-retry { display:none; margin:20px auto 0; padding:8px 22px; border:1px solid #d3a965;
    border-radius:999px; color:#ffe5ad; background:#26334b; cursor:pointer; }
  @keyframes loading-float { 50% { transform:translateY(-8px) rotate(7deg); } }
  @keyframes loading-shimmer { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
</style>

<div id="loading" role="status" aria-live="polite">
  <div class="loading-card">
    <div class="loading-gem" aria-hidden="true">💎</div>
    <div class="loading-title">進入礦坑</div>
    <div class="loading-subtitle">正在準備今天的尋寶旅程…</div>
    <div class="loading-track" role="progressbar" aria-label="遊戲載入進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill" class="loading-fill"></div></div>
    <div class="loading-readout"><span id="loading-message">整理礦坑地圖中</span><span id="loading-percent">0%</span></div>
    <button id="loading-retry" type="button" onclick="location.reload()">重新載入</button>
  </div>
</div>
<script>
// 只把進度算在進入遊戲前實際需要的地圖、十字鎬與介面圖片上。
window.mineLoading = (() => {
  const box = document.getElementById('loading');
  const fill = document.getElementById('loading-fill');
  const track = box.querySelector('[role="progressbar"]');
  const percent = document.getElementById('loading-percent');
  const message = document.getElementById('loading-message');
  const images = ['Loading.png','button.png','button_spin.png','ui_win_title.png','ui_big_win_title_v2.png','ui_super_win_title_v2.png','ui_big_win_number_panel.png'];
  for (let i=1; i<=5; i++) {
    images.push(`raw_ore_0${i}.png`, `polished_gem_0${i}.png`, `coin0${i}.png`);
    for (let grade=1; grade<=3; grade++) images.push(`polished_gem_0${i}_grade_${grade}.png`);
  }
  let mapRatio=0, mapReady=false, toolsDone=0, imagesDone=0, frameReady=false, failed=false, hidden=false;
  const update = () => {
    if (failed || hidden) return;
    const ready = mapReady && toolsDone===4 && imagesDone===images.length && frameReady;
    const value = ready ? 100 : Math.min(99, Math.round((mapRatio*.65 + toolsDone*.05 + imagesDone/images.length*.15)*100));
    fill.style.width = value+'%'; percent.textContent = value+'%'; track.setAttribute('aria-valuenow',value);
    message.textContent = !mapReady ? '整理礦坑地圖中' : toolsDone<4 ? '準備採礦工具中' : imagesDone<images.length ? '擦亮寶石與介面中' : '即將出發…';
    if (ready) { hidden=true; message.textContent='準備完成！'; box.classList.add('is-done'); setTimeout(()=>box.remove(),600); }
  };
  images.forEach(name => {
    const img=new Image();
    img.onload=img.onerror=()=>{ imagesDone++; update(); };
    img.src='images/'+name;
  });
  return {
    mapProgress: event => { if (event.total) { mapRatio=Math.max(mapRatio,Math.min(.98,event.loaded/event.total)); update(); } },
    mapReady: () => { mapRatio=1; mapReady=true; update(); },
    toolDone: () => { toolsDone=Math.min(4,toolsDone+1); update(); },
    rendered: () => { if (!frameReady) { frameReady=true; update(); } },
    mapFailed: () => { failed=true; message.textContent='地圖載入失敗，請檢查網路後重試'; document.getElementById('loading-retry').style.display='block'; }
  };
})();
</script>

<script>
/* ============================================================
   礦坑原型 · STEP 1
   目標：只驗證「操控角色在坑道裡走動」的手感。
   還沒有挖礦、背包、敵人 —— 那些是後面的步驟。
   ============================================================ */

/* ---------- 全域狀態（跟《苦艾與甘露》一樣，都放在 G 裡面） ---------- */
const G = {
  overview: false,
  cell: 0.75,
  size: 85,
  map: [],          // 0 = 可以走的地板, 1 = 石壁, 2 = 礦石
  ores: [],         // 礦石位置清單（給小地圖用）
  player: null,
  vel: { x:0, z:0 },
  camAngle: 0,      // 鏡頭水平轉角
  focus: { x:0, z:0 },  // 鏡頭的注視點（平滑跟著角色，鏡頭本身永遠不轉向）
  camDist: 0.95,    // 手機遊玩視距：讓人物和附近道路保持清楚
  keys: {},
  _frameFactor: 1,  // 幀率校正（以 60fps 為基準）
  _last: performance.now(),
  _fpsAcc: 0, _fpsCount: 0
};

/* ============================================================
   0. 「固定的亂數」
   地圖要每次都長一樣，就不能用 Math.random（它每次都不同）。
   這個 rand() 是從固定的種子算出來的假亂數：看起來很隨機，
   但只要種子一樣，產生的順序就永遠一模一樣 → 地圖固定。
   ★ 想換一張新地圖？把下面的 MAP_SEED 改成別的數字就好。
   （礦石位置刻意還是用 Math.random，所以每次玩都不一樣）
   ============================================================ */
const MAP_SEED = 20260910;
let _seed = MAP_SEED;
function rand() {
  _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ============================================================
   1. 產生礦坑地圖
   做法：整張地圖先全部塞滿石頭，再用「隨機亂走」的方式挖出坑道。
   這樣挖出來的坑道彎彎曲曲，比整齊的格子更像礦坑。
   ============================================================ */
function generateMine() {
  G.map=Array.from({length:G.size},()=>Array(G.size).fill(1));
  const c=Math.floor(G.size/2);
  CAVERN.cells.forEach(([x,z])=>{G.map[x+c][z+c]=0;});
  for(let i=0;i<G.size;i++)for(let j=0;j<G.size;j++){
    const x=toWorld(i),z=toWorld(j),b=CAVERN.bridge;
    if(x>=b[0]&&x<=b[1]&&z>=b[2]&&z<=b[3])G.map[i][j]=0;
  }
  G.ores=[];
  return;
  const N = G.size;
  const center = Math.floor(N / 2);

  // 這個形狀與 fixed_mine_map.glb 完全相同；不使用亂數。
  const ellipse = (x, z, cx, cz, rx, rz) =>
    Math.pow((x - cx) / rx, 2) + Math.pow((z - cz) / rz, 2) <= 1;
  const walkable = (x, z) => {
    if (Math.abs(x) > 8 || Math.abs(z) > 13) return false;
    return ellipse(x,z,0,-9,7,5.1) || ellipse(x,z,-0.8,0,7.4,4.8) ||
           ellipse(x,z,0.3,9,7,4.5) || (Math.abs(x) <= 3 && z >= -9 && z <= 9) ||
           (Math.abs(x + 1) <= 4 && z >= -4 && z <= 5) ||
           ellipse(x,z,-5.2,5.2,3.2,3) || ellipse(x,z,5,-4.5,3,3.3);
  };

  for (let x = 0; x < N; x++) {
    G.map[x] = [];
    for (let z = 0; z < N; z++)
      G.map[x][z] = walkable(x - center, z - center) ? 0 : 1;
  }
  G.ores = [];
}

/* 格子座標 <-> 世界座標 */
function toWorld(i) { return (i - Math.floor(G.size / 2)) * G.cell; }
function toGrid(v)  { return Math.round(v / G.cell + Math.floor(G.size / 2)); }

/* ============================================================
   2. 程式畫出來的貼圖（不用外部圖檔，所以雙擊就能跑）
   之後你要換成自己畫的圖，只要把這幾個函式換成讀取 png 就好。
   ============================================================ */
function makeRockTexture(base, speck) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 2600; i++) {
    const a = Math.random() * 0.16;
    g.fillStyle = (Math.random() < 0.5 ? 'rgba(0,0,0,' : 'rgba(255,240,220,') + a + ')';
    g.fillRect(Math.random()*128, Math.random()*128, 2 + Math.random()*3, 2 + Math.random()*3);
  }
  for (let i = 0; i < 26; i++) {           // 一些裂縫
    g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1;
    g.beginPath();
    let x = Math.random()*128, y = Math.random()*128;
    g.moveTo(x, y);
    for (let s = 0; s < 4; s++) { x += (Math.random()-.5)*34; y += (Math.random()-.5)*34; g.lineTo(x, y); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ============================================================
   3. 建立場景
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e16);
// 霧：讓遠方自然變黑，礦坑的「看不見前方」就是靠這個
scene.fog = new THREE.FogExp2(0x0d0e16, 0.0085);  // 數字越小＝看得越遠越亮

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

generateMine();

/* --- 舊的程序式地板與岩壁保留在檔案裡作為備用，但不再建立 --- */
if (false) {
/* --- 地板 --- */
const floorTex = makeRockTexture('#5b5145');
floorTex.repeat.set(G.size, G.size);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(G.size * G.cell, G.size * G.cell),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* --- 石壁：用 InstancedMesh 一次畫幾千個方塊，效能才夠 --- */
const wallTex = makeRockTexture('#6d5f50');
const wallGeo = new THREE.BoxGeometry(G.cell, G.cell * 1.6, G.cell);
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: .95 });

let wallCount = 0;
for (let x = 0; x < G.size; x++)
  for (let z = 0; z < G.size; z++) if (G.map[x][z] !== 0) wallCount++;   // 礦石格也是牆

const walls = new THREE.InstancedMesh(wallGeo, wallMat, wallCount);
walls.castShadow = walls.receiveShadow = true;
{
  const m = new THREE.Matrix4(); let i = 0;
  for (let x = 0; x < G.size; x++)
    for (let z = 0; z < G.size; z++) {
      if (G.map[x][z] === 0) continue;
      // 高低稍微亂一點，看起來比較像天然岩壁（用 rand，所以每次一樣）
      const h = 0.85 + rand() * 0.4;
      m.makeScale(1, h, 1);
      m.setPosition(toWorld(x), G.cell * 1.6 * h / 2 - 0.4, toWorld(z));
      walls.setMatrixAt(i++, m);
    }
}
scene.add(walls);

/* --- 礦石：會自己發光，所以在黑暗裡看得到（是天然的路標） --- */
const oreGroup = new THREE.Group();
const oreGeo = new THREE.IcosahedronGeometry(G.cell * 0.42, 0);
G.ores.forEach(o => {
  const warm = Math.random() < 0.35;
  const mat = new THREE.MeshStandardMaterial({
    color:    warm ? 0xffb457 : 0x6fe4ff,
    emissive: warm ? 0xff8c1a : 0x27b8e0,
    emissiveIntensity: 0.9,
    roughness: 0.35, metalness: 0.3, flatShading: true
  });
  const mesh = new THREE.Mesh(oreGeo, mat);
  // 從岩壁中心往坑道方向推半格，讓礦石卡在牆面上
  mesh.position.set(
    toWorld(o.x) + o.dx * G.cell * 0.46,
    G.cell * 0.62,
    toWorld(o.z) + o.dz * G.cell * 0.46
  );
  mesh.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
  oreGroup.add(mesh);
});
scene.add(oreGroup);
document.getElementById('oreleft').textContent = G.ores.length;
}

/* --- 載入 Blender 製作的固定地圖與路燈 --- */
const oreGroup = new THREE.Group();
scene.add(oreGroup);
document.getElementById('oreleft').textContent = '0';

const gltfLoader = new THREE.GLTFLoader();
gltfLoader.load('models/reference_cavern.glb', gltf => {
  const fixedMap = gltf.scene;
  fixedMap.name = '固定礦坑地圖';
  fixedMap.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = obj.name.indexOf('Floor') < 0;
      obj.receiveShadow = true;
      if (obj.name === 'Walls_Collision') obj.visible = false;
    }
  });
  scene.add(fixedMap);
  if(typeof applyCavernMaterials==='function')applyCavernMaterials(fixedMap);
  if(typeof applyConceptLightingMaterials==='function')applyConceptLightingMaterials(fixedMap);
  window.mineLoading.mapReady();
}, event => window.mineLoading.mapProgress(event), err => { console.error('固定地圖載入失敗', err); window.mineLoading.mapFailed(); });

if(false){
gltfLoader.load('models/stylized_mine_lamp.glb', gltf => {
  const placements = [
    { x:-8, z:-12, r:0 }, { x:7, z:-6, r:Math.PI },
    { x:-7, z:3, r:0 }, { x:7, z:9, r:Math.PI }
  ];
  placements.forEach(p => {
    const lampModel = gltf.scene.clone(true);
    lampModel.position.set(p.x, 0, p.z);
    lampModel.rotation.y = p.r;
    lampModel.scale.setScalar(0.82);
    lampModel.traverse(obj => {
      if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; }
      if (obj.isLight) {
        obj.intensity = 2.2;
        obj.distance = 12;
        obj.decay = 2;
        obj.castShadow = false;
      }
    });
    scene.add(lampModel);
  });
}, undefined, err => console.error('路燈模型載入失敗', err));
}
CAVERN.lamps.forEach(([x,z])=>{
 const light=new THREE.PointLight(0xffb553,3.8,10,2);light.position.set(x,2.1,z);scene.add(light);
});
const depth=new THREE.Mesh(new THREE.PlaneGeometry(90,110),new THREE.MeshBasicMaterial({color:0x102b52}));
depth.rotation.x=-Math.PI/2;depth.position.y=-7.8;scene.add(depth);

/* --- 角色：圓潤粉嫩的小鼴鼠礦工（依角色定稿圖製作） --- */
const player = new THREE.Group();
{
  const fur = new THREE.MeshStandardMaterial({ color:0x8f574f, roughness:.76 });
  const cream = new THREE.MeshStandardMaterial({ color:0xdca78e, roughness:.78 });
  const pink = new THREE.MeshStandardMaterial({ color:0xd85f70, roughness:.70 });
  const noseMat = new THREE.MeshStandardMaterial({ color:0xdf5668, roughness:.62 });
  const dark = new THREE.MeshStandardMaterial({ color:0x17151b, roughness:.30 });
  const claw = new THREE.MeshStandardMaterial({ color:0xe8b59d, roughness:.64 });
  const helmetMat = new THREE.MeshStandardMaterial({ color:0xf0c552, roughness:.46, metalness:.04 });
  const helmetDark = new THREE.MeshStandardMaterial({ color:0x9a7244, roughness:.68 });
  const scarfMat = new THREE.MeshStandardMaterial({ color:0x4d8790, roughness:.74, side:THREE.DoubleSide });
  const beltMat = new THREE.MeshStandardMaterial({ color:0x76503d, roughness:.78 });
  const buckleMat = new THREE.MeshStandardMaterial({ color:0xc99b48, roughness:.45, metalness:.18 });
  const lampMat = new THREE.MeshStandardMaterial({
    color:0xffe9a0, emissive:0xffa62f, emissiveIntensity:2.1, roughness:.25
  });

  const scarfRing = new THREE.Mesh(new THREE.TorusGeometry(.56,.095,10,28), scarfMat);

  player.userData.body = body;
  player.userData.head = head;
  player.userData.bodyBaseY = 1.05;
  player.userData.headBaseY = 2.28;

  player.userData.walkBlend = 0;
  legs.forEach(leg=>leg.userData.restPosition=leg.position.clone());

  // 十字鎬掛點跟著右手臂一起動；模型載入後會放進這個容器。

  pickaxeMount.rotation.z = -.58;
  arms[1].add(pickaxeMount);
  player.userData.pickaxeMount = pickaxeMount;

/* ============================================================
   5. 碰撞：不讓角色走進石頭裡
   做法很簡單 —— 分開檢查 X 和 Z 兩個方向，
   哪個方向會撞牆就取消哪個方向的移動（所以貼著牆走還是很順）。
   ============================================================ */
const RADIUS = 0.48;
function blocked(wx, wz) {
  const b=CAVERN.bridge;
  const inside=(x,z)=>{
    if(x>=b[0]&&x<=b[1]&&z>=b[2]&&z<=b[3])return true;
    return G.map[toGrid(x)]?.[toGrid(z)]===0;
  };
  for(let k=0;k<12;k++){
    const a=k*Math.PI/6;
    if(!inside(wx+Math.cos(a)*RADIUS,wz+Math.sin(a)*RADIUS))return true;
  }
  if(CAVERN.obstacles.some(o=>Math.hypot(wx-o.x,wz-o.z)<RADIUS+o.r))return true;
  return false;
  const half = G.cell / 2;
  const gx = toGrid(wx), gz = toGrid(wz);
  for (let dx = -1; dx <= 1; dx++)
    for (let dz = -1; dz <= 1; dz++) {
      const cx = gx + dx, cz = gz + dz;
      if (cx < 0 || cz < 0 || cx >= G.size || cz >= G.size) return true;
      if (G.map[cx][cz] === 0) continue;                       // 地板，可以走
      const px = toWorld(cx), pz = toWorld(cz);
      if (Math.abs(wx - px) < half + RADIUS && Math.abs(wz - pz) < half + RADIUS) return true;
    }
  return false;
}

/* ============================================================
   6. 每一格畫面
   ============================================================ */
let walkPhase = 0;

function tick(now) {
  requestAnimationFrame(tick);

  /* --- 幀率校正：不管螢幕是 60Hz 還是 144Hz，走路速度都一樣 --- */
  const dt = now - G._last; G._last = now;
  G._frameFactor = Math.min(3, Math.max(0.2, dt / (1000 / 60)));
  const f = G._frameFactor;

  /* --- 鏡頭轉角（Q / E） --- */
  if (G.keys['KeyZ']) G.camAngle += 0.025 * f;   // E 鍵讓給「開採」用，轉鏡頭改成 Z / X
  if (G.keys['KeyX']) G.camAngle -= 0.025 * f;

  /* --- 讀取方向鍵，換算成「螢幕上的方向」 --- */
  let ix = 0, iz = 0;
  if (G.keys['KeyW'] || G.keys['ArrowUp'])    iz -= 1;
  if (G.keys['KeyS'] || G.keys['ArrowDown'])  iz += 1;
  if (G.keys['KeyA'] || G.keys['ArrowLeft'])  ix -= 1;
  if (G.keys['KeyD'] || G.keys['ArrowRight']) ix += 1;

  const running = G.keys['ShiftLeft'] || G.keys['ShiftRight'] || G.moveRun;
  const speed = (running ? 0.19 : 0.105) * f;

  let mx = 0, mz = 0;
  if (G.moveDir) {
    // 點擊移動：mobile.js 已經算好世界座標的方向，直接照著走
    mx = G.moveDir.x * speed;
    mz = G.moveDir.z * speed;
    ix = mx; iz = mz;                            // 讓下面知道「現在正在移動」
  } else if (ix || iz) {
    const len = Math.hypot(ix, iz);              // 斜走不會比較快
    ix /= len; iz /= len;
    const ca = Math.cos(G.camAngle), sa = Math.sin(G.camAngle);
    mx = (ix * ca + iz * sa) * speed;            // 依鏡頭角度旋轉
    mz = (iz * ca - ix * sa) * speed;
  }

  /* --- 加速／減速，讓移動有點重量感（不是硬邦邦的開關） --- */
  const accel = 0.22 * f, friction = Math.pow(0.80, f);
  G.vel.x += (mx - G.vel.x) * accel;
  G.vel.z += (mz - G.vel.z) * accel;
  if (!ix && !iz) { G.vel.x *= friction; G.vel.z *= friction; }

  /* --- 分軸推進 + 撞牆檢查 --- */
  const p = player.position;
  if (!blocked(p.x + G.vel.x, p.z)) p.x += G.vel.x; else G.vel.x = 0;
  if (!blocked(p.x, p.z + G.vel.z)) p.z += G.vel.z; else G.vel.z = 0;

  /* --- 角色轉向：慢慢轉過去，不要瞬間翻面 ---
     開採時要轉身面向那顆礦石，十字鎬的尖端才會朝著礦物敲；
     以前只看移動方向，所以停下來開採時常常是側對著礦石揮空。 */
  const moving = Math.hypot(G.vel.x, G.vel.z);
  const diggingOre = (window.P && window.P.mining) ? window.P.mining : null;
  let faceTarget = null;
  if (diggingOre)        faceTarget = Math.atan2(diggingOre.x - p.x, diggingOre.z - p.z);
  else if (moving > .01) faceTarget = Math.atan2(G.vel.x, G.vel.z);
  if (faceTarget !== null) {
    let diff = faceTarget - player.rotation.y;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * Math.min(1, (diggingOre ? .30 : .22) * f);
  }

  /* --- 小鼴鼠走路循環 -------------------------------------------
     先把速度平滑成 0~1，起步和停步才不會突然抽動。
     左右腳輪流向前並抬起，身體每一步輕彈兩次；手臂反向擺動。
     整隻角色只有很小的左右傾斜，因此帽子與十字鎬也會帶一點慣性。 */
  const walkTarget = Math.min(1,moving/.075);
  player.userData.walkBlend += (walkTarget-player.userData.walkBlend)*Math.min(1,.16*f);
  const walkBlend = player.userData.walkBlend;
  walkPhase += (.17+(running?.055:0))*f*walkBlend;
  const stride = Math.sin(walkPhase);
  const bounce = .5-.5*Math.cos(walkPhase*2);
  const legSwing = stride*.62*walkBlend;
  const armSwing = stride*.48*walkBlend;
  const leftLeg=player.userData.legs[0], rightLeg=player.userData.legs[1];
  leftLeg.rotation.x=legSwing;
  rightLeg.rotation.x=-legSwing;
  leftLeg.position.y=leftLeg.userData.restPosition.y+Math.max(0,stride)*.13*walkBlend;
  rightLeg.position.y=rightLeg.userData.restPosition.y+Math.max(0,-stride)*.13*walkBlend;
  leftLeg.position.z=leftLeg.userData.restPosition.z+stride*.12*walkBlend;
  rightLeg.position.z=rightLeg.userData.restPosition.z-stride*.12*walkBlend;
  player.userData.arms[0].rotation.x=-armSwing;
  const miningNow = !!(window.P && window.P.mining);
  // 開採時加大向前下方的行程，讓十字鎬尖端確實落向礦物。
  if (miningNow) {
    // 前 62% 蓄力抬鎬，後 38% 快速落下；phase 歸零的瞬間就是實際撞擊點。
    const phase = Math.max(0, Math.min(.999, Number(window.P.swingPhase) || 0));
    let swing;
    if (phase < .62) {
      const q = phase / .62;
      swing = .25 + (-1.00 - .25) * (1 - Math.pow(1 - q, 2));
    } else {
      const q = (phase - .62) / .38;
      swing = -1.00 + (.82 + 1.00) * q * q;
    }
    player.userData.arms[1].rotation.x = swing;
  } else {
    player.userData.arms[1].rotation.x = armSwing;
  }
  const idle = Math.sin(now * .0022);
  const bodyScale=player.userData.bodyBaseScale;
  player.userData.body.position.y=player.userData.bodyBaseY+idle*.012*(1-walkBlend)+bounce*.022*walkBlend;
  player.userData.head.position.y=player.userData.headBaseY;
  player.userData.body.scale.set(
    bodyScale.x*(1+bounce*.025*walkBlend),
    bodyScale.y*(1-bounce*.030*walkBlend),
    bodyScale.z*(1+bounce*.025*walkBlend)
  );
  player.userData.body.rotation.z=-stride*.045*walkBlend;
  player.rotation.z=-stride*.025*walkBlend;
  player.position.y=bounce*.10*walkBlend;

  /* --- 頭燈跟著臉的方向 --- */
  lamp.position.set(p.x, 2.42 + p.y, p.z);
  lamp.target.position.set(
    p.x + Math.sin(player.rotation.y) * 14,
    0.5,
    p.z + Math.cos(player.rotation.y) * 14
  );

  /* --- 鏡頭：只平移，絕對不轉向 ---------------------------------
     會頭暈的原因是：鏡頭慢慢追上去、卻同時盯著角色「當下」的位置，
     一邊追一邊調整視線，畫面就會歪來歪去。
     改法：先算一個平滑跟著角色的「注視點」focus，
     鏡頭位置 = focus + 固定偏移量，再看向同一個 focus。
     位置和注視點永遠差同一段距離 → 鏡頭角度完全不變，
     畫面只會左右上下滑動，不會旋轉。                              */
  const d = G.camDist;
  const lag = Math.min(1, 0.12 * f);
  G.focus.x += (p.x - G.focus.x) * lag;
  G.focus.z += (p.z - G.focus.z) * lag;

  const offX = Math.sin(G.camAngle) * -17 * d;
  const offZ = Math.cos(G.camAngle) *  17 * d;
  camera.position.set(G.focus.x + offX, 25 * d, G.focus.z + offZ);   // 25 = 鏡頭高度，越大越像從正上方往下看
  G.mineShake = Math.max(0, (G.mineShake || 0) - .018 * f);
  if (!G.overview && G.mineShake > .001) {
    camera.position.x += (Math.random() - .5) * G.mineShake;
    camera.position.y += (Math.random() - .5) * G.mineShake * .48;
    camera.position.z += (Math.random() - .5) * G.mineShake;
  }
  camera.lookAt(G.focus.x, 1.8, G.focus.z);
  if(G.overview){
    const fit=Math.max(1,.8/camera.aspect);
    camera.position.set(7*fit,65*fit,42*fit);camera.lookAt(0,0,-2);
  }

  /* --- 礦石慢慢轉、慢慢閃 --- */
  const t = now * 0.001;
  oreGroup.children.forEach((o, i) => {
    o.rotation.y += 0.004 * f;
    o.material.emissiveIntensity = 0.75 + Math.sin(t * 1.6 + i) * 0.25;
  });

  drawMinimap();

  /* --- 右上角資訊 --- */
  G._fpsAcc += 1000 / dt; G._fpsCount++;
  if (G._fpsCount >= 20) {
    document.getElementById('fps').textContent = Math.round(G._fpsAcc / G._fpsCount);
    G._fpsAcc = 0; G._fpsCount = 0;
    document.getElementById('pos').textContent = toGrid(p.x) + ', ' + toGrid(p.z);
  }

  renderer.render(scene, camera);
  window.mineLoading.rendered();
}

/* ============================================================
   7. 小地圖
   ============================================================ */
const mm = document.getElementById('minimap').getContext('2d');
function drawMinimap() {
  const R = 17, S = 150 / (R * 2 + 1);
  const gx = toGrid(G.player.position.x), gz = toGrid(G.player.position.z);
  mm.clearRect(0, 0, 150, 150);
  for (let dx = -R; dx <= R; dx++)
    for (let dz = -R; dz <= R; dz++) {
      const x = gx + dx, z = gz + dz;
      if (x < 0 || z < 0 || x >= G.size || z >= G.size) continue;
      const v = G.map[x][z];
      if (v === 1) continue;
      mm.fillStyle = v === 2 ? '#6fe4ff' : '#48413a';
      mm.fillRect((dx + R) * S, (dz + R) * S, S, S);
    }
  mm.fillStyle = '#ffd79a';
  mm.beginPath(); mm.arc(75, 75, 3.2, 0, 7); mm.fill();
}

/* 開跑 */
requestAnimationFrame(tick);
